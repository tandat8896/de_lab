services:
  # =========================================================================
  # HADOOP HDFS (1 NameNode + 2 DataNodes) - Big Data Europe Stack
  # =========================================================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop-namenode
    restart: always
    ports:
      - "9870:9870" # HDFS NameNode Web UI
      - "9000:9000" # HDFS FileSystem RPC
    volumes:
      - hadoop_namenode_data:/hadoop/dfs/name
    environment:
      - CLUSTER_NAME=de-lab
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=2
      - HDFS_CONF_dfs_permissions=false
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    networks:
      - bigdata-net

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop-datanode-1
    restart: always
    depends_on:
      - namenode
    volumes:
      - hadoop_datanode1_data:/hadoop/dfs/data
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=2
    ports:
      - "9864:9864" # DataNode 1 Web UI
    deploy:
      resources:
        limits:
          memory: 800M
        reservations:
          memory: 384M
    networks:
      - bigdata-net

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop-datanode-2
    restart: always
    depends_on:
      - namenode
    volumes:
      - hadoop_datanode2_data:/hadoop/dfs/data
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=2
    ports:
      - "9865:9864" # DataNode 2 Web UI (mapped to 9865 to prevent collision)
    deploy:
      resources:
        limits:
          memory: 800M
        reservations:
          memory: 384M
    networks:
      - bigdata-net

  # =========================================================================
  # APACHE SPARK (1 Master + 2 Workers)
  # =========================================================================
  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: spark-master
    restart: always
    depends_on:
      - namenode
      - datanode1
      - datanode2
    ports:
      - "8082:8080" # Spark Master Web UI (mapped to 8082 to avoid Airflow 8080)
      - "7077:7077" # Spark Master Port for Workers / Jobs
    environment:
      - INIT_DAEMON_STEP=setup_spark
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - SPARK_DAEMON_MEMORY=512m
    volumes:
      - ./apps:/opt/spark-apps
    deploy:
      resources:
        limits:
          memory: 800M
        reservations:
          memory: 384M
    networks:
      - bigdata-net

  spark-worker-1:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker-1
    restart: always
    depends_on:
      - spark-master
    ports:
      - "8083:8081" # Spark Worker 1 Web UI
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - ./apps:/opt/spark-apps
    deploy:
      resources:
        limits:
          memory: 1500M # Buffer overhead to prevent exit code 137 (OOM killed)
        reservations:
          memory: 512M
    networks:
      - bigdata-net

  spark-worker-2:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker-2
    restart: always
    depends_on:
      - spark-master
    ports:
      - "8084:8081" # Spark Worker 2 Web UI (mapped to 8084)
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - ./apps:/opt/spark-apps
    deploy:
      resources:
        limits:
          memory: 1500M # Buffer overhead to prevent exit code 137 (OOM killed)
        reservations:
          memory: 512M
    networks:
      - bigdata-net

# =========================================================================
# PERSISTENT VOLUMES (Data survives restarts)
# =========================================================================
volumes:
  hadoop_namenode_data:
    driver: local
  hadoop_datanode1_data:
    driver: local
  hadoop_datanode2_data:
    driver: local

# =========================================================================
# NETWORKS
# =========================================================================
networks:
  bigdata-net:
    name: bigdata-net
    driver: bridge
